name: Reviewed table-first EPL release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reviewed-table-release.yml'
      - 'data/reviewed/epl-table-first-release.json'
permissions:
  contents: read
concurrency:
  group: reviewed-table-first-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13' 'fonttools>=4.60,<5'
      - name: Apply exact tested renderer integration, not arbitrary code
        run: |
          python - <<'PY'
          import hashlib,subprocess
          from pathlib import Path
          p=Path('.integration/table-first.patch')
          if p.exists():
              raw=p.read_bytes()
              assert hashlib.sha256(raw).hexdigest()=='cca975db4677ffdb177a576c2bf052ff3a5112cc97971edf11226e964a7184a2'
              paths=[s.split(' b/',1)[1] for s in raw.decode().splitlines() if s.startswith('diff --git ')]
              assert set(paths)=={'build.py','assets/style.css','scripts/comparison_tables.py'} and len(paths)==3
              subprocess.run(['git','apply','--check',str(p)],check=True)
              subprocess.run(['git','apply','--index',str(p)],check=True)
          else:
              assert '_overview.normalize' in Path('build.py').read_text()
              assert '.qi-match-facts' in Path('assets/style.css').read_text()
          PY
      - name: Join reviewed factual input and eight-language copy
        run: |
          mkdir -p reports
          python - <<'PY'
          import json
          from pathlib import Path
          f=json.loads(Path('data/reviewed/epl-table-first-facts.json').read_text())
          t=json.loads(Path('data/reviewed/epl-table-first-copy.json').read_text())
          assert {g['group'] for g in f['groups']}==set(t['groups'])
          for group in f['groups']:group['copy']=t['groups'][group['group']]
          Path('reports/batch.json').write_text(json.dumps(f,ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/render_reviewed_batch.py --input reports/batch.json --out reports --refresh
      - name: Test all existing and new renderers
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee reports/tests.txt
          python build.py --out /tmp/quickiris-site --blogger-out /tmp/quickiris-blogger
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('reports/release-report.json').read_text())
          assert len(report['articles'])==16 and len(report['images'])==2
          for filename in report['articles']:
              a=json.loads(Path(filename).read_text())
              html=(Path('/tmp/quickiris-site/posts')/a['slug']/'index.html').read_text()
              assert a['quickiris_revision'] in html and 'class="qi-match-overview"' in html
              assert 'class="qi-match-facts"' in html and '<html lang="'+a['language']+'"' in html
              assert a['figures'][0]['src'] in html
              if a['article_kind']=='recap':assert 'qi-scoreboard' in html and 'qi-goal-table' in html
          preview=Path('/tmp/quickiris-site/posts/epl-2645272-preview-ko/index.html').read_text()
          assert '2026-10-25 (일) 14:00 GMT' in preview and '2026-10-25 (일) 23:00 KST' in preview
          PY
      - name: Persist tested native renderer integration without publishing new stories yet
        run: |
          if [ -f .integration/table-first.patch ]; then
            git rm .integration/table-first.patch
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat: integrate compact match facts, scoreboards and goal timelines'
            git push origin HEAD:main
          fi
      - name: Produce inspectable public output
        run: |
          mkdir -p reports/site reports/source/scripts reports/source/assets
          cp -r /tmp/quickiris-site/assets reports/site/
          cp build.py reports/source/
          cp assets/style.css reports/source/assets/
          cp scripts/match_overview.py scripts/comparison_tables.py scripts/render_reviewed_batch.py reports/source/scripts/
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          r=json.loads(Path('reports/release-report.json').read_text())
          for name in r['articles']:
              a=json.loads(Path(name).read_text())
              shutil.copytree(Path('/tmp/quickiris-site/posts')/a['slug'],Path('reports/site/posts')/a['slug'],dirs_exist_ok=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: table-first-review
          path: reports/
          retention-days: 3
      - name: Check exact reviewed revision before public release
        id: approval
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('reports/release-report.json').read_text());p=Path('data/reviewed/epl-table-first-release.json')
          allowed=False
          if p.exists():
              a=json.loads(p.read_text())
              assert a['operation']=='publish-two-table-first-stories'
              assert a['revision']==r['revision'],'Output changed since visual/content inspection'
              allowed=True
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('publish='+str(allowed).lower()+'\n')
          print('Publication approved for this exact revision:',allowed)
          PY
      - name: Commit only the sixteen new articles and two shared English images
        if: steps.approval.outputs.publish == 'true'
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          r=json.loads(Path('reports/release-report.json').read_text())
          subprocess.run(['git','add','--',*r['articles'],*r['images']],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'content: publish Liverpool-Brighton preview and Brighton-Palace recap with at-a-glance tables'
            git push origin HEAD:main
          fi
          git rev-parse HEAD > reports/published-commit.txt
      - uses: actions/configure-pages@v5
        if: steps.approval.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.approval.outputs.publish == 'true'
        with:
          path: /tmp/quickiris-site
      - uses: actions/deploy-pages@v4
        id: deploy
        if: steps.approval.outputs.publish == 'true'
      - name: Verify actual live article revisions, overview tables and shared image bytes
        if: steps.approval.outputs.publish == 'true'
        run: |
          python - <<'PY'
          import hashlib,json,time
          from pathlib import Path
          from urllib.request import Request,urlopen
          r=json.loads(Path('reports/release-report.json').read_text())
          for attempt in range(4):
              checks=[]
              try:
                  for name,url in zip(r['articles'],r['urls']):
                      a=json.loads(Path(name).read_text())
                      with urlopen(Request(url,headers={'User-Agent':'QuickIris-Table-Release-Check/1'}),timeout=15) as response:body=response.read().decode()
                      assert r['revision'] in body and '<html lang="'+a['language']+'"' in body
                      assert 'class="qi-match-facts"' in body and a['figures'][0]['src'] in body
                      if a['article_kind']=='recap':assert 'qi-goal-table' in body
                      checks.append({'url':url,'language':a['language'],'verified':True})
                  for path,sha in r['image_hashes'].items():
                      with urlopen('https://atin84.github.io/'+path,timeout=15) as response:body=response.read()
                      assert hashlib.sha256(body).hexdigest()==sha
                  break
              except Exception:
                  if attempt==3:raise
                  time.sleep(10)
          Path('reports/live-checks.json').write_text(json.dumps({'articles':checks,'images_verified':2,'model_api_calls':0,'mode':'supervised-reviewed-publication'},ensure_ascii=False,indent=2))
          print('Verified',len(checks),'live articles and two image hashes')
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.approval.outputs.publish == 'true'
        with:
          name: table-first-live-verification
          path: |
            reports/live-checks.json
            reports/published-commit.txt
            reports/release-report.json
          retention-days: 7
