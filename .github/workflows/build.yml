name: Build and validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify publisher failure and duplicate handling
        run: python -m unittest discover -s tests -v
      - name: Build both destinations
        run: python build.py --config config.json --content content --out dist
      - name: Save reviewable output
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: |
            dist/
            exports/blogger/
          retention-days: 7
