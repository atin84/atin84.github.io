name: Reviewed multilingual batch
on:
  push:
    branches: [main]
    paths:
      - 'data/reviewed/active-batch.json'
      - '.github/workflows/reviewed-batch.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quickiris-reviewed-batch-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13' 'fonttools>=4.60,<5'
      - name: Install the exact reviewed locale-timezone patch when present
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          p=Path('.integration/locale-timezones.patch')
          if p.exists():
              raw=p.read_bytes()
              assert hashlib.sha256(raw).hexdigest()=='deefa181eb9bf2abe800096047a934c4b0cbb0ef62a68dc5f6aea9832c848903'
              names=[s.split(' b/',1)[1] for s in raw.decode().splitlines() if s.startswith('diff --git ')]
              assert set(names)=={'scripts/match_overview.py','scripts/render_reviewed_batch.py'} and len(names)==2
              subprocess.run(['git','apply','--check',str(p)],check=True)
              subprocess.run(['git','apply','--index',str(p)],check=True)
          else:
              assert "audience = _reader.profile(locale)" in Path('scripts/match_overview.py').read_text()
          PY
      - name: Build selected reviewed data without model calls
        run: |
          mkdir -p reports
          python - <<'PY'
          import json,re
          from pathlib import Path
          selected=json.loads(Path('data/reviewed/active-batch.json').read_text())
          assert selected['mode']=='supervised-reviewed-publication'
          for key in ('facts_path','copy_path'):
              assert re.fullmatch(r'data/reviewed/[a-z0-9-]+\.json',selected[key])
          facts=json.loads(Path(selected['facts_path']).read_text())
          copy=json.loads(Path(selected['copy_path']).read_text())
          assert {g['group'] for g in facts['groups']}==set(copy['groups'])
          for group in facts['groups']:group['copy']=copy['groups'][group['group']]
          Path('reports/batch.json').write_text(json.dumps(facts,ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/render_reviewed_batch.py --input reports/batch.json --out reports --refresh
      - name: Validate all articles and language-specific time rows
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee reports/tests.txt
          python build.py --out /tmp/quickiris-site --blogger-out /tmp/quickiris-blogger
          python - <<'PY'
          import json,re,sys
          from pathlib import Path
          from html.parser import HTMLParser
          from datetime import datetime,timezone
          sys.path.insert(0,'scripts')
          import reader_timezones
          class Times(HTMLParser):
              def __init__(self,html):super().__init__();self.values=[];self.feed(html)
              def handle_starttag(self,tag,attrs):
                  if tag=='time':self.values.append(dict(attrs))
          selected=json.loads(Path('data/reviewed/active-batch.json').read_text())
          r=json.loads(Path('reports/release-report.json').read_text())
          assert len(r['articles'])==selected['expected_articles'] and len(r['images'])==selected['expected_images']
          checks=[]
          for filename in r['articles']:
              a=json.loads(Path(filename).read_text());locale=a['language']
              html=(Path('/tmp/quickiris-site/posts')/a['slug']/'index.html').read_text()
              assert r['revision'] in html and '<html lang="'+locale+'"' in html
              assert a['figures'][0]['src'] in html
              table=re.search(r'<table class="qi-match-facts">.*?</table>',html,re.S).group()
              times=Times(table).values
              assert [v['data-timezone'] for v in times]==[a['match_overview']['venue_timezone'],reader_timezones.profile(locale)['zone'],'UTC']
              expected=datetime.fromisoformat(a['match_overview']['start_utc'].replace('Z','+00:00')).astimezone(timezone.utc)
              assert all(datetime.fromisoformat(v['datetime']).astimezone(timezone.utc)==expected for v in times)
              if locale!='ko':assert 'KST' not in table
              checks.append({'article':a['id'],'locale':locale,'times':times})
          Path('reports/timezone-checks.json').write_text(json.dumps(checks,ensure_ascii=False,indent=2))
          PY
      - name: Commit only tested native timezone integration before editorial release
        run: |
          if [ -f .integration/locale-timezones.patch ]; then
            git rm .integration/locale-timezones.patch
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: render each language edition with its named representative timezone'
            git push origin HEAD:main
          fi
      - name: Save inspectable HTML and exact renderer inputs
        run: |
          mkdir -p reports/site reports/source/scripts reports/source/assets
          cp -r /tmp/quickiris-site/assets reports/site/
          cp build.py reports/source/
          cp assets/style.css reports/source/assets/
          cp scripts/reader_timezones.py scripts/match_overview.py scripts/render_reviewed_batch.py reports/source/scripts/
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          r=json.loads(Path('reports/release-report.json').read_text())
          for filename in r['articles']:
              a=json.loads(Path(filename).read_text())
              shutil.copytree(Path('/tmp/quickiris-site/posts')/a['slug'],Path('reports/site/posts')/a['slug'],dirs_exist_ok=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-batch-stage
          path: reports/
          retention-days: 3
      - name: Require the exact inspected content revision
        id: approval
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('reports/release-report.json').read_text())
          selected=json.loads(Path('data/reviewed/active-batch.json').read_text())
          approved=selected.get('approved_revision')
          if approved:assert approved==r['revision'],'Generated content changed since review'
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('publish='+str(bool(approved)).lower()+'\n')
          print('Exact revision approved:',bool(approved))
          PY
      - name: Commit reviewed new article sources and shared English images
        if: steps.approval.outputs.publish == 'true'
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          r=json.loads(Path('reports/release-report.json').read_text())
          subprocess.run(['git','add','--',*r['articles'],*r['images']],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'content: publish reviewed EPL preview and recap with locale-specific viewing times'
            git push origin HEAD:main
          fi
          git rev-parse HEAD > reports/published-commit.txt
      - uses: actions/configure-pages@v5
        if: steps.approval.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.approval.outputs.publish == 'true'
        with:
          path: /tmp/quickiris-site
      - uses: actions/deploy-pages@v4
        id: deploy
        if: steps.approval.outputs.publish == 'true'
      - name: Verify live language timezones, revisions and image hashes
        if: steps.approval.outputs.publish == 'true'
        run: |
          python - <<'PY'
          import hashlib,json,re,sys,time
          from pathlib import Path
          from urllib.request import Request,urlopen
          sys.path.insert(0,'scripts');import reader_timezones
          r=json.loads(Path('reports/release-report.json').read_text())
          for attempt in range(4):
              checks=[]
              try:
                  for name,url in zip(r['articles'],r['urls']):
                      a=json.loads(Path(name).read_text());locale=a['language']
                      with urlopen(Request(url,headers={'User-Agent':'QuickIris-Locale-Time-Check/1'}),timeout=15) as response:html=response.read().decode()
                      assert r['revision'] in html and '<html lang="'+locale+'"' in html and a['figures'][0]['src'] in html
                      table=re.search(r'<table class="qi-match-facts">.*?</table>',html,re.S).group()
                      zone=reader_timezones.profile(locale)['zone']
                      assert 'data-timezone="'+zone+'"' in table and 'data-timezone="UTC"' in table and 'data-timezone="Europe/London"' in table
                      if locale!='ko':assert 'KST' not in table
                      checks.append({'url':url,'language':locale,'reader_timezone':zone,'verified':True})
                  for path,sha in r['image_hashes'].items():
                      with urlopen('https://atin84.github.io/'+path,timeout=15) as response:content=response.read()
                      assert hashlib.sha256(content).hexdigest()==sha
                  break
              except Exception:
                  if attempt==3:raise
                  time.sleep(10)
          # Previously published overview pages must inherit the corrected renderer too.
          previous=[]
          for locale in ('en','es','hi','ja'):
              url='https://atin84.github.io/posts/epl-2645272-preview-'+locale+'/'
              with urlopen(url,timeout=15) as response:body=response.read().decode()
              table=re.search(r'<table class="qi-match-facts">.*?</table>',body,re.S).group()
              assert 'data-timezone="'+reader_timezones.profile(locale)['zone']+'"' in table and 'KST' not in table
              previous.append({'url':url,'verified':True})
          Path('reports/live-checks.json').write_text(json.dumps({'articles':checks,'existing_overview_checks':previous,'images_verified':len(r['images']),'model_api_calls':0,'mode':'supervised-reviewed-publication'},ensure_ascii=False,indent=2))
          print('Verified',len(checks),'new pages,',len(previous),'existing pages and',len(r['images']),'image hashes')
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.approval.outputs.publish == 'true'
        with:
          name: reviewed-batch-live-verification
          path: |
            reports/live-checks.json
            reports/published-commit.txt
            reports/release-report.json
            reports/timezone-checks.json
          retention-days: 7
